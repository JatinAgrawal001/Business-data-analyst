    <script>
      // Safeguard for environments where Window.prototype.fetch only has a getter
      try {
        if (typeof window !== 'undefined') {
          let _fetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get() {
              return _fetch;
            },
            set(fn) {
              _fetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        }
      } catch (e) {
        // Silently continue
      }
    </script>
