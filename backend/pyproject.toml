[project]
name = "backend"
version = "0.1.0"
description = "FastAPI Enterprise Data Analytics & AI Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.12",
    "supabase>=2.10.0",
    "pyjwt>=2.9.0",
    "cryptography>=43.0.0",
    "google-genai>=0.1.1",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "google-adk>=2.7.1",
    "reportlab>=5.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning"
]
